<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge AI — Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center p-4 bg-dot-pattern antialiased">
  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-lg shadow-slate-900/10">
        <i class="fa-solid fa-shield-halved text-xl text-indigo-400"></i>
      </div>
      <div>
        <div class="text-2xl font-black tracking-tight leading-none text-slate-900">SkillBridge<span class="text-indigo-600">.ai</span></div>
        <div class="text-[11px] font-bold text-slate-400 tracking-wider uppercase mt-1">Admin Protected System</div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
      <div class="mb-6">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-bold mb-3">
          <i class="fa-solid fa-lock text-[10px]"></i>
          <span>Restricted Access</span>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Sign in to continue</h1>
        <p class="text-xs text-slate-500 mt-1 leading-relaxed">
          This hosted platform requires verified administrator authentication. Enter your admin credentials to unlock SkillBridge AI.
        </p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Admin Email Address
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
              <i class="fa-regular fa-envelope text-sm"></i>
            </span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required
              class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 focus:bg-white transition-colors"
              placeholder="e.g. Admin123@gmail.com"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Admin Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
              <i class="fa-solid fa-key text-sm"></i>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="w-full pl-11 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 focus:bg-white transition-colors"
              placeholder="Enter password"
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-slate-700"
              aria-label="Toggle password visibility"
            >
              <i id="toggle-password-icon" class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <div id="login-error" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-700 flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation text-rose-500 flex-shrink-0"></i>
          <span id="login-error-text">Invalid email or password.</span>
        </div>

        <button
          type="submit"
          id="login-btn"
          class="w-full py-3.5 bg-slate-900 hover:bg-black text-white text-sm font-bold rounded-xl shadow-md shadow-slate-900/10 hover:shadow-lg transition-all flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
          <span id="login-btn-text">Open SkillBridge AI</span>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-center gap-2 text-xs text-slate-400">
        <i class="fa-solid fa-shield-halved text-emerald-600"></i>
        <span>256-bit encrypted authentication gateway</span>
      </div>
    </div>
  </div>

  <script>
    // Password toggle
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-password-icon');
    
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleIcon.className = isPassword ? 'fa-regular fa-eye-slash text-sm' : 'fa-regular fa-eye text-sm';
    });

    // Check if already authenticated on backend or client
    async function checkExistingAuth() {
      try {
        const res = await fetch('/api/session', { credentials: 'same-origin' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.ok) {
            localStorage.setItem('sb_admin_auth', '1');
            localStorage.setItem('sb_admin_email', data.email || 'Admin123@gmail.com');
            window.location.href = '/index.html';
            return;
          }
        }
      } catch (_) {
        // Fallback for non-server environment
      }
    }
    checkExistingAuth();

    // Handle login submission
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const errorEl = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');

      errorEl.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = 'Verifying credentials...';

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      try {
        let serverVerified = false;
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email, password })
          });

          if (response.ok) {
            const data = await response.json().catch(() => ({}));
            if (data.ok) {
              serverVerified = true;
            }
          } else if (response.status === 401) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || 'Invalid email or password.');
          }
        } catch (netErr) {
          // If server threw 401, rethrow
          if (netErr.message && netErr.message.includes('Invalid email')) {
            throw netErr;
          }
          // Server endpoint not reachable (static hosting)
        }

        // Static or Node verification fallback
        const hardcodedEmail = 'admin123@gmail.com';
        const hardcodedPass = '@2005Admin';

        if (serverVerified || (email === hardcodedEmail && password === hardcodedPass)) {
          localStorage.setItem('sb_admin_auth', '1');
          localStorage.setItem('sb_admin_email', email);
          sessionStorage.setItem('sb_admin_auth', '1');
          window.location.href = '/index.html';
          return;
        }

        throw new Error('Invalid email or password. Please verify credentials.');
      } catch (error) {
        errorText.textContent = error.message || 'Login failed. Please check credentials.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Open SkillBridge AI';
      }
    });
  </script>
</body>
</html>
